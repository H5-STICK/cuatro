
name: Investigar yt-dlp Cuatro

on:
  workflow_dispatch:

jobs:
  investigar:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Identificar extractores Mediaset
        shell: bash
        run: |
          yt-dlp --list-extractors | grep -i -E \
            'mediaset|cuatro|mitele|DRM' || true

      - name: Comprobar pagina con extractor generico
        shell: bash
        run: |
          yt-dlp \
            --ignore-config \
            --no-cache-dir \
            --use-extractors generic \
            --simulate \
            --list-formats \
            --verbose \
            "https://www.mediasetinfinity.es/directo/cuatro/"
