
name: Diagnostico Cuatro HLS

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Comprobar manifiesto HLS
        shell: bash
        run: |
          yt-dlp \
            --ignore-config \
            --no-cache-dir \
            --simulate \
            --list-formats \
            --verbose \
            "https://directos.mediasetinfinity.es/orilinear09/live/linear09/main/main.isml/dai.m3u8"
